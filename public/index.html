<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="フリマ用写真分割">
  <link rel="manifest" href="/manifest.json">
  <title>フリマ用写真分割</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f2f7;
      min-height: 100dvh;
    }
    .screen {
      display: none;
      min-height: 100dvh;
      padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);
    }
    .screen.active { display: block; }

    .page-title { font-size: 30px; font-weight: 800; color: #111; margin-bottom: 6px; }
    .page-sub   { font-size: 15px; color: #6b7280; margin-bottom: 28px; }

    .btn {
      display: block; width: 100%; padding: 16px;
      border: none; border-radius: 14px;
      font-size: 17px; font-weight: 600; cursor: pointer;
      margin-bottom: 10px; -webkit-tap-highlight-color: transparent;
    }
    .btn-primary   { background: #007AFF; color: #fff; }
    .btn-secondary { background: #fff; color: #007AFF; border: 1.5px solid #007AFF; }
    .btn-gray      { background: #e5e7eb; color: #374151; }
    .btn:disabled  { opacity: 0.35; }
    .btn:active:not(:disabled) { filter: brightness(0.88); }

    /* ── Screen 1: split count ── */
    .split-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px; margin-bottom: 28px;
    }
    .split-btn {
      background: #fff; border: 2px solid #e5e7eb; border-radius: 16px;
      padding: 18px 4px 14px; display: flex; flex-direction: column;
      align-items: center; gap: 6px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .split-btn .num { font-size: 28px; font-weight: 800; color: #111; }
    .split-btn .lbl { font-size: 11px; color: #9ca3af; font-weight: 500; }
    .split-btn.sel  { border-color: #007AFF; background: #eff6ff; }
    .split-btn.sel .num { color: #007AFF; }
    /* mini grid icon */
    .lp { width: 28px; height: 28px; display: flex; flex-direction: column; gap: 2px; }
    .lp-row { display: flex; flex: 1; gap: 2px; }
    .lp-cell { flex: 1; background: #d1d5db; border-radius: 2px; }
    .split-btn.sel .lp-cell { background: #93c5fd; }

    /* ── Screen 2: photo slots ── */
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .back-btn {
      background: #fff; border: none; border-radius: 10px;
      width: 38px; height: 38px; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; -webkit-tap-highlight-color: transparent;
    }
    .header-title { font-size: 20px; font-weight: 700; }
    .header-sub   { font-size: 13px; color: #6b7280; }

    .slots-wrap { position: relative; aspect-ratio: 1; margin-bottom: 20px; }
    .slot {
      position: absolute; background: #fff; border: 2px dashed #d1d5db; border-radius: 12px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      cursor: pointer; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .slot-num { font-size: 22px; font-weight: 800; color: #d1d5db; }
    .slot-add { font-size: 11px; color: #9ca3af; }
    .slot.filled { border-style: solid; border-color: #e5e7eb; }

    /* ── Screen 3: result ── */
    #preview-canvas {
      width: 100%; border-radius: 16px; display: block;
      margin-bottom: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.13);
    }

    /* ── Loading overlay ── */
    .overlay {
      display: none; position: fixed; inset: 0; z-index: 99;
      background: rgba(0,0,0,0.48);
      align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      color: #fff; font-size: 16px; font-weight: 600;
    }
    .overlay.on { display: flex; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="overlay" id="overlay"><div class="spinner"></div><div>作成中…</div></div>

<!-- Screen 1 -->
<div class="screen active" id="s1">
  <div class="page-title">📸 フリマ用写真分割</div>
  <div class="page-sub">何分割にしますか？</div>
  <div class="split-grid" id="split-grid"></div>
  <button class="btn btn-primary" id="btn-next" disabled>次へ　写真を選ぶ →</button>
</div>

<!-- Screen 2 -->
<div class="screen" id="s2">
  <div class="header">
    <button class="back-btn" id="back1">‹</button>
    <div>
      <div class="header-title" id="s2-title">写真を選ぶ</div>
      <div class="header-sub">枠をタップして追加</div>
    </div>
  </div>
  <div class="slots-wrap" id="slots-wrap"></div>
  <button class="btn btn-primary" id="btn-make" disabled>コラージュを作成 →</button>
  <button class="btn btn-gray"    id="btn-multi">まとめて選ぶ（複数選択）</button>
</div>

<!-- Screen 3 -->
<div class="screen" id="s3">
  <div class="header">
    <button class="back-btn" id="back2">‹</button>
    <div>
      <div class="header-title">完成！</div>
      <div class="header-sub">保存ボタンで写真アプリに保存</div>
    </div>
  </div>
  <canvas id="preview-canvas"></canvas>
  <button class="btn btn-primary"   id="btn-save">📥 写真に保存</button>
  <button class="btn btn-secondary" id="btn-again">もう一度作る</button>
</div>

<input type="file" accept="image/*"          id="fi1" style="display:none">
<input type="file" accept="image/*" multiple id="fim" style="display:none">

<script>
'use strict';

// 分割数 → [各行の列数]
const LAYOUTS = { 2:[2], 3:[1,2], 4:[2,2], 5:[2,3], 6:[3,3], 7:[3,4], 8:[4,4] };

// ミニアイコン用
const LP = {
  2:[[2]],   3:[[1],[2]],   4:[[2],[2]],
  5:[[2],[3]], 6:[[3],[3]], 7:[[3],[4]], 8:[[4],[4]]
};

const CANVAS_SIZE = 1500, PAD = 20, GAP = 10, CORNER = 16;

let splitCount = 0, photos = [], pickIdx = -1;

const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0,0);
};
const loading = on => $('overlay').classList.toggle('on', on);

// ── Build split buttons ──────────────────────
const grid = $('split-grid');
for (let n = 2; n <= 8; n++) {
  const btn = document.createElement('button');
  btn.className = 'split-btn'; btn.dataset.n = n;
  const lp = LP[n];
  const lpHtml = `<div class="lp">${lp.map(row=>`<div class="lp-row">${Array(row[0]).fill('<div class="lp-cell"></div>').join('')}</div>`).join('')}</div>`;
  btn.innerHTML = `${lpHtml}<div class="num">${n}</div><div class="lbl">分割</div>`;
  btn.onclick = () => {
    document.querySelectorAll('.split-btn').forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');
    splitCount = n;
    $('btn-next').disabled = false;
  };
  grid.appendChild(btn);
}

$('btn-next').onclick = () => {
  photos = new Array(splitCount).fill(null);
  buildSlots();
  $('s2-title').textContent = `${splitCount}枚の写真を選ぶ`;
  updateMakeBtn();
  show('s2');
};

// ── Slots ────────────────────────────────────
function buildSlots() {
  const wrap = $('slots-wrap'); wrap.innerHTML = '';
  const layout = LAYOUTS[splitCount];
  const numRows = layout.length;
  const maxCols = Math.max(...layout);

  // キャンバスと同じ計算でスロット位置を決定（パーセント座標）
  const S = 100, p = PAD/CANVAS_SIZE*100, g = GAP/CANVAS_SIZE*100;
  const C = Math.min((S-p*2-g*(maxCols-1))/maxCols, (S-p*2-g*(numRows-1))/numRows);
  const gridW = maxCols*C+(maxCols-1)*g, gridH = numRows*C+(numRows-1)*g;
  const sx = (S-gridW)/2, sy = (S-gridH)/2;

  let idx = 0;
  for (let r = 0; r < numRows; r++) {
    const numCols = layout[r];
    const rowW = numCols*C+(numCols-1)*g;
    const rx = sx+(gridW-rowW)/2;
    const y = sy+r*(C+g);
    for (let c = 0; c < numCols; c++) {
      const slot = makeSlot(idx++);
      slot.style.left=`${rx+c*(C+g)}%`; slot.style.top=`${y}%`;
      slot.style.width=`${C}%`; slot.style.height=`${C}%`;
      wrap.appendChild(slot);
    }
  }
}

function makeSlot(idx) {
  const el = document.createElement('div');
  el.className = 'slot'; el.dataset.idx = idx;
  el.innerHTML = `<div class="slot-num">${idx+1}</div><div class="slot-add">タップして追加</div>`;
  el.onclick = () => { pickIdx = idx; $('fi1').value=''; $('fi1').click(); };
  return el;
}

function refreshSlot(idx) {
  const el = document.querySelector(`.slot[data-idx="${idx}"]`);
  if (!el) return;
  if (photos[idx]) {
    const tmp = document.createElement('canvas');
    tmp.width = tmp.height = 200;
    const ctx = tmp.getContext('2d');
    const img = photos[idx];
    const sc = Math.max(200/img.width, 200/img.height);
    ctx.drawImage(img, (200-img.width*sc)/2, (200-img.height*sc)/2, img.width*sc, img.height*sc);
    el.innerHTML = `<img src="${tmp.toDataURL('image/jpeg',0.7)}">`;
    el.classList.add('filled');
  } else {
    el.innerHTML = `<div class="slot-num">${idx+1}</div><div class="slot-add">タップして追加</div>`;
    el.classList.remove('filled');
  }
}

function updateMakeBtn() {
  const n = photos.filter(Boolean).length;
  const btn = $('btn-make');
  btn.disabled = n < splitCount;
  btn.textContent = n < splitCount ? `コラージュを作成（${n}/${splitCount}枚）→` : 'コラージュを作成 →';
}

$('fi1').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  loading(true);
  photos[pickIdx] = await createImageBitmap(f);
  loading(false); refreshSlot(pickIdx); updateMakeBtn();
};

$('btn-multi').onclick = () => { $('fim').value=''; $('fim').click(); };
$('fim').onchange = async e => {
  const files = Array.from(e.target.files).slice(0, splitCount);
  if (!files.length) return;
  loading(true);
  for (let i = 0; i < files.length; i++) {
    photos[i] = await createImageBitmap(files[i]);
    refreshSlot(i);
  }
  loading(false); updateMakeBtn();
};

$('btn-make').onclick = async () => {
  loading(true);
  await new Promise(r => requestAnimationFrame(r));
  buildCollage();
  loading(false);
  show('s3');
};

// ── Canvas ───────────────────────────────────
function buildCollage() {
  const canvas = $('preview-canvas');
  const S = CANVAS_SIZE;
  canvas.width = canvas.height = S;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, S, S);

  const layout = LAYOUTS[splitCount];
  const numRows = layout.length;
  const maxCols = Math.max(...layout);

  // 全セルを正方形にするため、縦横どちらの制約もクリアできる最大サイズを算出
  const C = Math.min(
    (S - PAD*2 - GAP*(maxCols-1)) / maxCols,
    (S - PAD*2 - GAP*(numRows-1)) / numRows
  );

  // グリッド全体をキャンバス中央に配置
  const gridW = maxCols*C + (maxCols-1)*GAP;
  const gridH = numRows*C + (numRows-1)*GAP;
  const startX = (S - gridW) / 2;
  const startY = (S - gridH) / 2;

  let pi = 0;
  for (let r = 0; r < numRows; r++) {
    const numCols = layout[r];
    // 列数が少ない行はその行内で中央揃え
    const rowW = numCols*C + (numCols-1)*GAP;
    const rowX = startX + (gridW - rowW) / 2;
    const y = startY + r*(C+GAP);
    for (let c = 0; c < numCols; c++) {
      drawCell(ctx, photos[pi++], rowX + c*(C+GAP), y, C, C);
    }
  }
}

function drawCell(ctx, img, x, y, w, h) {
  ctx.save();
  // rounded clip
  ctx.beginPath();
  ctx.moveTo(x+CORNER, y);
  ctx.lineTo(x+w-CORNER, y); ctx.quadraticCurveTo(x+w, y, x+w, y+CORNER);
  ctx.lineTo(x+w, y+h-CORNER); ctx.quadraticCurveTo(x+w, y+h, x+w-CORNER, y+h);
  ctx.lineTo(x+CORNER, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-CORNER);
  ctx.lineTo(x, y+CORNER); ctx.quadraticCurveTo(x, y, x+CORNER, y);
  ctx.closePath(); ctx.clip();
  if (img) {
    const sc = Math.max(w/img.width, h/img.height);
    ctx.drawImage(img, x+(w-img.width*sc)/2, y+(h-img.height*sc)/2, img.width*sc, img.height*sc);
  } else {
    ctx.fillStyle='#e5e7eb'; ctx.fill();
  }
  ctx.restore();
}

// ── Save ─────────────────────────────────────
$('btn-save').onclick = () => {
  $('preview-canvas').toBlob(async blob => {
    const file = new File([blob], `collage_${Date.now()}.jpg`, {type:'image/jpeg'});
    try {
      if (navigator.share && navigator.canShare({files:[file]})) {
        await navigator.share({files:[file]});
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
      }
    } catch(e) { if (e.name !== 'AbortError') alert('保存できませんでした'); }
  }, 'image/jpeg', 0.93);
};

$('btn-again').onclick = () => {
  photos=[]; splitCount=0;
  document.querySelectorAll('.split-btn').forEach(b=>b.classList.remove('sel'));
  $('btn-next').disabled=true;
  show('s1');
};

$('back1').onclick = () => show('s1');
$('back2').onclick = () => show('s2');

// SW
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
